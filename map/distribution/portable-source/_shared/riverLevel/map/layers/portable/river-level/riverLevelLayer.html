<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>河川水位</title>
  <script src="../svgmap-slawa-client/svgMapLayerLib.js"></script>
</head>
<body>
<script type="module">
import { initRepresentativePinsLayer } from '../representative-pins/representativePinsCore.js';
import { createPortableNetworkClient } from '../portable-network/safeFetch.js';
import { renderRiverLevelDetail } from './riverLevelDetail.js';

let started = false;
const start = () => {
  if (started) return;
  started = true;
  const network = createPortableNetworkClient({
    // tight iframeとS-LaWA iframeはいずれもcontroller URLを<base>として保持する。
    manifestUrl: new URL('./layer.package.json', document.baseURI).href,
    baseUrl: document.baseURI,
  });
  initRepresentativePinsLayer({
    mode: 'portable',
    renderFeatureDetail: renderRiverLevelDetail,
    refreshIntervalMs: 120_000,
    networkFetch: network.fetch,
  });
};
window.addEventListener('layerWebAppReady', start, { once: true });
if (window.svgMap && window.svgImage) queueMicrotask(start);
</script>
</body>
</html>
