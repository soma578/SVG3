<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>河川監視カメラ</title>
  <script src="../svgmap-slawa-client/svgMapLayerLib.js"></script>
</head>
<body>
<script type="module">
import { initRepresentativePinsLayer } from '../representative-pins/representativePinsCore.js';
import { renderWebcamDetail } from './webcamDetail.js';

const RUNTIME_POLICY_URL = './webcam-runtime-policy.json';
const MINIMUM_REFRESH_COOLDOWN_MS = 30_000;

const loadRuntimePolicy = async () => {
  try {
    const url = new URL(RUNTIME_POLICY_URL, window.location.href);
    url.searchParams.set('_', String(Date.now()));
    const response = await fetch(url, { cache: 'no-store', credentials: 'same-origin' });
    if (!response.ok) return null;
    return response.json();
  } catch {
    return null;
  }
};

const formatAcquiredAt = (date) => new Intl.DateTimeFormat('ja-JP', {
  year: 'numeric', month: 'numeric', day: 'numeric',
  hour: '2-digit', minute: '2-digit', second: '2-digit',
}).format(date);

const bindImageRefresh = (modal) => {
  const image = modal?.querySelector?.('[data-webcam-image]');
  const button = modal?.querySelector?.('[data-webcam-refresh]');
  const status = modal?.querySelector?.('[data-webcam-status]');
  if (!image || !button) return;
  const cooldownMs = MINIMUM_REFRESH_COOLDOWN_MS;
  let cooldownUntil = Date.now() + cooldownMs;

  const requestImage = () => {
    const now = Date.now();
    if (now < cooldownUntil) return;
    const source = image.getAttribute('data-source');
    if (!source) return;
    cooldownUntil = now + cooldownMs;
    button.disabled = true;
    image.src = `${source}${source.includes('?') ? '&' : '?'}t=${now}`;
    window.setTimeout(() => {
      button.disabled = false;
    }, cooldownMs);
  };

  image.addEventListener('error', () => {
    image.closest('figure')?.setAttribute('hidden', '');
    if (status) status.textContent = '画像を取得できません。公式ページで確認してください';
  });
  image.addEventListener('load', () => {
    image.closest('figure')?.removeAttribute('hidden');
    if (status) status.textContent = `画像取得：${formatAcquiredAt(new Date())}`;
  });
  button.addEventListener('click', requestImage);
  button.disabled = true;
  window.setTimeout(() => {
    button.disabled = false;
  }, cooldownMs);
};

const renderWebcamDetailWithPolicy = async (feature) => {
  const policy = await loadRuntimePolicy();
  return renderWebcamDetail(feature, {
    imageEnabled: policy?.riverWebcamImages?.enabled === true,
  });
};
renderWebcamDetailWithPolicy.afterShow = (_feature, modal) => bindImageRefresh(modal);

let started = false;
const start = () => {
  if (started) return;
  started = true;
  initRepresentativePinsLayer({
    mode: 'portable',
    renderFeatureDetail: renderWebcamDetailWithPolicy,
  });
};
window.addEventListener('layerWebAppReady', start, { once: true });
if (window.svgMap && window.svgImage) queueMicrotask(start);
</script>
</body>
</html>
