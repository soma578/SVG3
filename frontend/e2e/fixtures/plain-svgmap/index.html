<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG3 layers on plain SVGMap</title>
<style>
html,body,#mapcanvas{width:100%;height:100%;margin:0;overflow:hidden}
#controller,#layerlist,#layerList,#initLayerSpecificUI,#centerSight,.layerUI,.essentialUI{display:none!important}
#layerSpecificUI{position:absolute;right:12px;top:12px;z-index:20;max-width:400px;background:#fff}
#plainControls{position:absolute;left:12px;top:12px;z-index:30;width:min(290px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;box-sizing:border-box;padding:12px;border:1px solid #b9c3cc;border-radius:10px;background:rgba(255,255,255,.94);box-shadow:0 3px 14px rgba(0,0,0,.18);font:14px/1.45 system-ui,sans-serif}
#plainControls h1{margin:0 0 4px;font-size:16px}
#plainControls p{margin:0 0 9px;color:#475569;font-size:12px}
#plainControls label{display:block;padding:3px 0;cursor:pointer}
#plainControls input{margin-right:7px}
</style>
<script>window.svgMapOptions={enableEssentialUI:false,enableGIS:false,enableAuthoringTool:false,enableCustomLayersManager:false,enableLayerUI:false}</script>
</head>
<body>
<img id="centerSight" alt="" width="1" height="1" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
<div id="mapcanvas" data-src="./Container.svg"></div>
<section id="plainControls">
  <h1>プレーンSVGMap検証</h1>
  <p>SVG3の画面基盤を使わず、Containerから各レイヤーを直接表示します。</p>
  <div id="plainLayerChoices">SVGMapを初期化中…</div>
</section>
<div id="controller"></div><div id="layerlist"></div><div id="layerList"></div>
<div id="layerSpecificUI"></div><div id="initLayerSpecificUI"></div>
<script type="module">
const {svgMap}=await import('/map/vendor/svgmapjs/SVGMapLv0.1_r18module.js');
window.svgMap=svgMap;
svgMap.initLoad();
window.setTimeout(async()=>{
  svgMap.setGeoViewPort?.(34.25,133.25,1.3,1.3,false);
  const choices = [
    ['layer-base-area','行政界',true],
    ['layer-offline-basemap-japan','オフライン背景 全国',false],
    ['layer-offline-basemap','オフライン背景 岡山',true],
    ['layer-evacuation','避難所',false],
    ['layer-team-activity-pins','チーム活動ピン',false],
    ['layer-team-activity','チーム活動エリア',false],
    ['layer-flood-warning','洪水・気象警報',false],
    ['layer-river-level','河川水位',false],
    ['layer-japan-river-webcams','全国河川監視カメラ',false],
    ['layer-road-closure','道路通行情報',false],
    ['layer-hazard','ハザード',false],
    ['layer-current-location','現在地',false],
    ['layer-artifact-sample','配布レイヤーサンプル',false],
  ];
  const setVisible = (id, visible) => {
    const mount = svgMap.getSvgImages().root?.getElementById(id);
    const identifier = mount?.getAttribute('iid') || mount?.getAttribute('title') || id;
    svgMap.setLayerVisibility(identifier, visible, visible ? {exec:'appearOnLayerLoad'} : undefined);
    svgMap.refreshScreen?.();
  };
  const list = document.getElementById('plainLayerChoices');
  list.textContent='';
  for (const [id,title,checked] of choices) {
    const label=document.createElement('label');
    const input=document.createElement('input');
    input.type='checkbox';
    input.checked=checked;
    input.addEventListener('change',()=>setVisible(id,input.checked));
    label.append(input,title);
    list.append(label);
    if (checked) setVisible(id,true);
  }
  await Promise.resolve(svgMap.refreshScreen?.());
  document.documentElement.dataset.ready='true';
},500);
</script>
</body>
</html>
